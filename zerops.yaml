zerops:
  - setup: api
    build:
      base: nodejs@latest
      # Vite/Rollup native binary: Ubuntu (glibc) avoids Alpine musl optional-dep misses.
      os: ubuntu
      buildCommands:
        # Drop Windows lockfile so optional native deps resolve for Linux.
        - rm -rf node_modules package-lock.json
        - npm install
        - npm run build -w @room/shared
        - npm run build -w @room/api
        - npm run build -w @room/web
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@latest
      os: ubuntu
      ports:
        - port: 4000
          httpSupport: true
      envVariables:
        PORT: "4000"
        SERVE_WEB: "true"
        WEB_DIST: apps/web/dist
        PUBLIC_WEB_URL: https://api-20a-4000.ny1.zerops.app
        PUBLIC_API_URL: https://api-20a-4000.ny1.zerops.app
      start: node apps/api/dist/index.js

  - setup: worker
    build:
      base: nodejs@latest
      os: ubuntu
      buildCommands:
        - rm -rf node_modules package-lock.json
        - npm install
        - npm run build -w @room/shared
        - npm run build -w @room/worker
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@latest
      os: ubuntu
      envVariables:
        API_URL: http://api:4000
        POLL_MS: "800"
      start: node apps/worker/dist/index.js
